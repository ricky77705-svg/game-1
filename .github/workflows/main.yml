name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skilltree-neoforge-1.21.1/skilltree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: skilltree-jar
          path: skilltree-neoforge-1.21.1/skilltree/build/libs/*.jar
